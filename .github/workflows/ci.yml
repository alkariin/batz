name: CI

# Every check of the repository, on every push to main and every pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'
  GO_VERSION: '1.27'

jobs:
  personal-files:
    name: No personal file tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Bank statements and their exports, exports of the app, personal
      # mapping configs, signing keys and env files. Fictitious statements
      # are allowed under testdata/ or fixtures/.
      - name: Check the tracked files
        run: |
          forbidden='(^|/)priv[eé]? - |(^|/)config-[0-9]{4}\.yaml|(^|/)specification\.txt$|\.(jks|keystore|p12|pfx|pem|key)$|(^|/)key\.properties$|(^|/)\.env(\..*)?$|(^|/)batz-export-[^/]*(\.zip$|/)|(^|/)LISEZMOI\.txt$'
          found=$({
            git ls-files | grep -Ei "$forbidden" | grep -v '\.env\.example$'
            git ls-files | grep -Ei '\.(pdf|csv)$' | grep -Ev '(^|/)(testdata|fixtures)/'
          } || true)
          if [ -n "$found" ]; then
            echo "::error::personal or secret files are tracked"
            echo "$found"
            exit 1
          fi
          echo "No personal or secret file among $(git ls-files | wc -l) tracked files."

  server:
    name: Server (build, vet, tests, end-to-end)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: batz-web/src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: batz-web/src/go.sum
      # The extraction of statements runs pdftotext, as in the server image.
      - name: Install pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go build ./...
      - run: go vet ./...
      # Includes test/e2e, which runs the real binary over HTTPS.
      - run: go test -race ./...

  app:
    name: App (analysis, tests, end-to-end against the server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: batz-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: batz-web/src/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The server of the end-to-end tests reads the fictitious statements
      # with pdftotext.
      - name: Install pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      # test/e2e pairs the app's code with this real server, built with the
      # version the tests expect (as test/e2e/server_harness.dart does).
      - name: Build the server for the end-to-end tests
        working-directory: batz-web/src
        run: |
          go build -o "$RUNNER_TEMP/batz-web" \
            -ldflags "-X github.com/alkariin/batz/batz-web/internal/version.Version=v0.1.0-e2e" .
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
        env:
          BATZ_SERVER_BIN: ${{ runner.temp }}/batz-web

  build-linux:
    name: Build Ubuntu
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: batz-ui
    steps:
      - uses: actions/checkout@v7
      - name: Install the Linux toolchain
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build linux

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: batz-ui
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: batz-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Debug-key signed here; only the release workflow uses the real key.
      - run: flutter build apk
      - name: Check the APK carries SQLCipher
        run: unzip -l build/app/outputs/flutter-apk/app-release.apk | grep 'lib/arm64-v8a/libsqlcipher.so'

  server-image:
    name: Server image (build, start, HTTPS /healthz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg VERSION=ci -t batz-web:ci batz-web
      - name: Start it and call /healthz over HTTPS
        run: |
          docker run -d --name batz -p 8443:8443 --read-only --cap-drop ALL batz-web:ci
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' batz)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' batz | grep -qx healthy
          curl -sSk https://127.0.0.1:8443/healthz | tee /dev/stderr | grep -q '"status":"ok"'
      # Every fictitious statement, compared with its expected JSON. Exit
      # code 2 is a statement the checks refuse, as some of them must be.
      - name: Extract the test set inside the image
        run: |
          testdata="$PWD/batz-web/src/internal/infrastructure/extraction/postfinance/testdata"
          failed=0
          for pdf in "$testdata"/*.pdf; do
            name=$(basename "$pdf" .pdf)
            status=0
            out=$(docker run --rm --read-only --cap-drop ALL --network none \
              -v "$testdata:/testdata:ro" --entrypoint batz-web batz-web:ci \
              extract "/testdata/$name.pdf" 2>/dev/null) || status=$?
            if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
              echo "$name: extraction failed (exit code $status)"
              failed=1
            elif [ "$out" = "$(cat "$testdata/$name.json")" ]; then
              echo "$name: as expected"
            else
              echo "$name: differs from $name.json"
              failed=1
            fi
          done
          exit "$failed"
      - if: failure()
        run: docker logs batz
