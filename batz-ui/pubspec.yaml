name: batz
description: "Personal accounting: where the money goes, what each year costs, how net worth evolves."
publish_to: 'none'

# 0.MINOR.PATCH until 1.0. The build number (+N) must increase on every
# Android release, or the phone refuses the update.
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
