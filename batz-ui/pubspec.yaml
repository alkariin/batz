name: batz
description: "Personal accounting: where the money goes, what each year costs, how net worth evolves."
publish_to: 'none'

# 0.MINOR.PATCH until 1.0. The build number (+N) must increase on every
# Android release, or the phone refuses the update.
version: 0.7.0+8

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.7.1
  crypto: ^3.0.8
  dio: ^5.11.1
  drift: ^2.35.4
  equatable: ^3.0.0
  file_picker: ^13.4.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  intl: any
  local_auth: ^3.0.2
  local_auth_android: ^2.3.0
  path_provider: ^2.1.6
  sqlite3: ^3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.16.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

# The local database is encrypted with SQLCipher on Android only; desktops use
# plain SQLite (docs/decisions.md, 2026-11-20).
hooks:
  user_defines:
    sqlite3:
      source:
        android: sqlcipher
        default: sqlite3
